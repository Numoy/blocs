[package]
name = "blocs"
version = "0.1.0"
description = "Created with Anchor"
license = "MIT"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "blocs"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
bytemuck = { version = "1.16.0", features = ["derive", "min_const_generics"] }
time = "=0.3.36"
