name: Release to Production

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/blocs
            git pull
            # Update the docker-compose to use the new image
            # (First change image name in compose to match GHCR if needed, 
            # OR we ensure the compose file uses the correct image name)
            
            # Since our compose file says 'image: blocs-app' (local build name)
            # We should probably update compose to use the GHCR image for production
            # OR we can just rebuild on server. 
            
            # OPTION 1: Rebuild on server (Simpler given current setup)
            # docker compose down
            # docker compose up -d --build
            
            # OPTION 2: Use the pre-built image from GHCR (Faster, cleaner)
            # We need to make sure docker-compose.yml uses the ghcr image.
            # Let's assume we want Option 1 for now as it matches previous flow?
            # Actually user asked to "run a new release", usually implies pre-built artifacts.
            
            # Let's stick to the Robust Option: Pull the image we just built.
            # But the docker-compose.yml currently says "build: .".
            # We can override it or just rebuild. Rebuild is safest for now without changing compose file logic too much.
            
            docker compose down
            docker compose up -d --build
