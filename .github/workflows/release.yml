name: Release to Production

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image repository name
        id: image_repo
        run: |
          set -euo pipefail
          repo="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "value=${repo}" >> "$GITHUB_OUTPUT"

      - name: Validate deployment configuration
        id: validate_config
        env:
          RAW_NEXT_PUBLIC_SOLANA_RPC_URL: ${{ vars.NEXT_PUBLIC_SOLANA_RPC_URL || secrets.NEXT_PUBLIC_SOLANA_RPC_URL || 'https://api.devnet.solana.com' }}
          RAW_SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL || secrets.SOLANA_RPC_URL }}
          HETZNER_ACCESS_KEY_ID: ${{ secrets.HETZNER_ACCESS_KEY_ID }}
          HETZNER_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_SECRET_ACCESS_KEY }}
          HETZNER_BUCKET_NAME: ${{ secrets.HETZNER_BUCKET_NAME }}
          RAW_HETZNER_ENDPOINT: ${{ vars.HETZNER_ENDPOINT || secrets.HETZNER_ENDPOINT }}
          RAW_HETZNER_PUBLIC_BASE_URL: ${{ vars.HETZNER_PUBLIC_BASE_URL || secrets.HETZNER_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail

          normalize_url() {
            local raw="${1:-}"
            raw="$(printf '%s' "$raw" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

            if [ -z "$raw" ]; then
              return 1
            fi

            if [ "${raw:0:1}" = "'" ] && [ "${raw: -1}" = "'" ]; then
              raw="${raw:1:${#raw}-2}"
            elif [ "${raw:0:1}" = "\"" ] && [ "${raw: -1}" = "\"" ]; then
              raw="${raw:1:${#raw}-2}"
            fi

            raw="$(printf '%s' "$raw" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -z "$raw" ]; then
              return 1
            fi

            local lower
            lower="$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              undefined|null|false|true|nan|none) return 1 ;;
            esac

            if printf '%s' "$raw" | grep -Fq '$''{{'; then
              return 1
            fi

            if [[ "$raw" == //* ]]; then
              raw="https:${raw}"
            elif [[ ! "$raw" =~ ^[a-zA-Z][a-zA-Z0-9+.-]*: ]]; then
              raw="https://${raw}"
            fi

            if [[ ! "$raw" =~ ^https?:// ]]; then
              return 1
            fi

            printf '%s' "$raw"
          }

          require_non_empty() {
            local name="$1"
            local value="${2:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          }

          require_non_empty "HETZNER_ACCESS_KEY_ID" "${HETZNER_ACCESS_KEY_ID:-}"
          require_non_empty "HETZNER_SECRET_ACCESS_KEY" "${HETZNER_SECRET_ACCESS_KEY:-}"
          require_non_empty "HETZNER_BUCKET_NAME" "${HETZNER_BUCKET_NAME:-}"

          if ! next_public_rpc="$(normalize_url "${RAW_NEXT_PUBLIC_SOLANA_RPC_URL:-}")"; then
            echo "::error::NEXT_PUBLIC_SOLANA_RPC_URL is missing or invalid. Example: https://api.devnet.solana.com"
            exit 1
          fi

          if [ -n "${RAW_SOLANA_RPC_URL:-}" ]; then
            if ! solana_rpc="$(normalize_url "${RAW_SOLANA_RPC_URL}")"; then
              echo "::error::SOLANA_RPC_URL is invalid. Example: https://api.devnet.solana.com"
              exit 1
            fi
          else
            solana_rpc="$next_public_rpc"
          fi

          if [ -n "${RAW_HETZNER_ENDPOINT:-}" ] && ! normalize_url "${RAW_HETZNER_ENDPOINT}" >/dev/null; then
            echo "::error::HETZNER_ENDPOINT is invalid. Example: https://fsn1.your-objectstorage.com"
            exit 1
          fi

          if [ -n "${RAW_HETZNER_PUBLIC_BASE_URL:-}" ] && ! normalize_url "${RAW_HETZNER_PUBLIC_BASE_URL}" >/dev/null; then
            echo "::error::HETZNER_PUBLIC_BASE_URL is invalid. Example: https://fsn1.your-objectstorage.com/blocs-storage"
            exit 1
          fi

          echo "next_public_solana_rpc_url=${next_public_rpc}" >> "$GITHUB_OUTPUT"
          echo "solana_rpc_url=${solana_rpc}" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_repo.outputs.value }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build_image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SOLANA_RPC_URL=${{ steps.validate_config.outputs.next_public_solana_rpc_url }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          NEXT_PUBLIC_SOLANA_RPC_URL: ${{ steps.validate_config.outputs.next_public_solana_rpc_url }}
          SOLANA_RPC_URL: ${{ steps.validate_config.outputs.solana_rpc_url }}
          HETZNER_ACCESS_KEY_ID: ${{ secrets.HETZNER_ACCESS_KEY_ID }}
          HETZNER_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_SECRET_ACCESS_KEY }}
          HETZNER_BUCKET_NAME: ${{ secrets.HETZNER_BUCKET_NAME }}
          HETZNER_REGION: ${{ vars.HETZNER_REGION || secrets.HETZNER_REGION || 'fsn1' }}
          HETZNER_ENDPOINT: ${{ vars.HETZNER_ENDPOINT || secrets.HETZNER_ENDPOINT }}
          HETZNER_PUBLIC_BASE_URL: ${{ vars.HETZNER_PUBLIC_BASE_URL || secrets.HETZNER_PUBLIC_BASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ vars.UPSTASH_REDIS_REST_URL || secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          BLOCS_IMAGE: ${{ env.REGISTRY }}/${{ steps.image_repo.outputs.value }}@${{ steps.build_image.outputs.digest }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,NEXT_PUBLIC_SOLANA_RPC_URL,SOLANA_RPC_URL,HETZNER_ACCESS_KEY_ID,HETZNER_SECRET_ACCESS_KEY,HETZNER_BUCKET_NAME,HETZNER_REGION,HETZNER_ENDPOINT,HETZNER_PUBLIC_BASE_URL,UPSTASH_REDIS_REST_URL,UPSTASH_REDIS_REST_TOKEN,BLOCS_IMAGE
          script: |
            set -euo pipefail

            compose() {
              if docker compose version >/dev/null 2>&1; then
                docker compose "$@"
              else
                docker-compose "$@"
              fi
            }

            print_diagnostics() {
              echo "---- docker compose ps ----"
              compose ps || true
              echo "---- blocs logs (tail) ----"
              docker logs --tail 200 blocs || true
              echo "---- caddy logs (tail) ----"
              docker logs --tail 120 caddy || true
            }

            probe_with_retry() {
              url="$1"
              output_file="$2"
              expected_status="$3"
              label="$4"
              max_attempts="${5:-30}"
              sleep_seconds="${6:-2}"

              attempt=1
              while [ "$attempt" -le "$max_attempts" ]; do
                status="$(curl -sS -o "$output_file" -w "%{http_code}" "$url" || true)"
                if [ "$status" = "$expected_status" ]; then
                  echo "$label ready (attempt $attempt/$max_attempts)."
                  return 0
                fi
                echo "$label not ready (attempt $attempt/$max_attempts, status $status)."
                sleep "$sleep_seconds"
                attempt=$((attempt + 1))
              done

              echo "$label failed after $max_attempts attempts."
              cat "$output_file" || true
              print_diagnostics
              return 1
            }

            # Login to GHCR
            echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

            cd ~/blocs
            git pull
            
            # Pull the latest image
            compose pull

            # Restart containers without an explicit down to reduce downtime.
            compose up -d --no-build --remove-orphans

            echo "Running smoke checks..."

            probe_with_retry "https://10000-blocks.com/" /tmp/blocs_home_probe.txt 200 "Homepage" 40 2
            probe_with_retry "https://10000-blocks.com/api/health" /tmp/blocs_health_probe.json 200 "Health endpoint" 40 2

            if ! grep -q '"configured":true' /tmp/blocs_health_probe.json; then
              echo "Health smoke check indicates upload/runtime configuration is incomplete"
              cat /tmp/blocs_health_probe.json
              print_diagnostics
              exit 1
            fi

            upload_attempt=1
            UPLOAD_STATUS=""
            while [ "$upload_attempt" -le 20 ]; do
              UPLOAD_STATUS=$(curl -sS -o /tmp/blocs_upload_probe.json -w "%{http_code}" -X POST \
                -F owner=test \
                -F blockId=1 \
                -F timestamp=1 \
                -F signature=test \
                https://10000-blocks.com/api/upload || true)

              if [ "$UPLOAD_STATUS" = "400" ]; then
                echo "Upload endpoint ready (attempt $upload_attempt/20)."
                break
              fi

              echo "Upload endpoint not ready (attempt $upload_attempt/20, status $UPLOAD_STATUS)."
              sleep 2
              upload_attempt=$((upload_attempt + 1))
            done

            if [ "$UPLOAD_STATUS" != "400" ]; then
              echo "Upload smoke check failed with status $UPLOAD_STATUS"
              cat /tmp/blocs_upload_probe.json || true
              print_diagnostics
              exit 1
            fi

            if grep -q "Upload service is not configured" /tmp/blocs_upload_probe.json; then
              echo "Upload smoke check detected missing runtime config"
              cat /tmp/blocs_upload_probe.json
              print_diagnostics
              exit 1
            fi

            echo "Smoke checks passed."
