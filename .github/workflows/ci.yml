name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    environment: staging
    env:
      NEXT_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
      HETZNER_ACCESS_KEY_ID: ${{ secrets.HETZNER_ACCESS_KEY_ID }}
      HETZNER_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_SECRET_ACCESS_KEY }}
      HETZNER_BUCKET_NAME: ${{ secrets.HETZNER_BUCKET_NAME }}
      HETZNER_REGION: fsn1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  anchor:
    name: Anchor Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./anchor
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: anchor/yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Cargo registry + index
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anchor/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Solana CLI
        id: cache-solana
        uses: actions/cache@v3
        with:
          path: |
            ~/.local/share/solana/install
          key: solana-${{ runner.os }}-v1.18.23-v2

      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v1.18.23/install)"

      - name: Add Solana to Path
        run: echo "/home/runner/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Verify Solana Install
        run: |
          echo "PATH: $PATH"
          ls -l /home/runner/.local/share/solana/install/active_release/bin/cargo-build-sbf || echo "Binary not found"

      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@v3
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-${{ runner.os }}-v0.32.1

      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cargo/bin
          curl -sSfL https://github.com/solana-foundation/anchor/releases/download/v0.32.1/anchor-0.32.1-x86_64-unknown-linux-gnu -o ~/.cargo/bin/anchor
          chmod +x ~/.cargo/bin/anchor

      - name: Add Anchor to Path
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Program
        run: anchor build

      # Run tests on localnet (default provider in CI usage usually implies localnet if not specified)
      - name: Run Tests
        run: anchor test
