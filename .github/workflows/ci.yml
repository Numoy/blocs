name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  anchor:
    name: Anchor Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./anchor
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: anchor/yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      # Cache Cargo Registry (Speeds up Rust builds)
      - name: Cache Cargo registry + index
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anchor/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # Cache Solana CLI (Restored and fixed)
      - name: Cache Solana CLI
        id: cache-solana
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: |
            ~/solana-release
          key: solana-${{ runner.os }}-v1.18.23

      # Cache Anchor CLI
      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-${{ runner.os }}-v0.32.1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libudev-dev libssl-dev

      # Install Solana (Only if cache miss) - Using GitHub Releases for reliability
      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://github.com/solana-labs/solana/releases/download/v1.18.23/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar jxf - -C $HOME

      # Install Anchor (Only if cache miss)
      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cargo/bin
          curl -sSfL https://github.com/solana-foundation/anchor/releases/download/v0.32.1/anchor-0.32.1-x86_64-unknown-linux-gnu -o ~/.cargo/bin/anchor
          chmod +x ~/.cargo/bin/anchor

      # Set Paths - This applies to all subsequent steps
      - name: Add Tools to Path
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/solana-release/bin" >> $GITHUB_PATH

      - name: Verify Versions
        run: |
          CARGO_BIN="$(command -v cargo)"
          echo "cargo path: ${CARGO_BIN}"
          if [[ "${CARGO_BIN}" != "$HOME/.cargo/bin/"* ]]; then
            echo "::error::Expected cargo from ~/.cargo/bin, got ${CARGO_BIN}"
            exit 1
          fi
          cargo --version
          solana --version
          anchor --version

      - name: Configure Anchor Wallet
        run: |
          WALLET_PATH="$RUNNER_TEMP/anchor-wallet.json"
          solana-keygen new --no-bip39-passphrase --force -o "$WALLET_PATH"
          echo "ANCHOR_WALLET=$WALLET_PATH" >> "$GITHUB_ENV"
          echo "Configured ANCHOR_WALLET at $WALLET_PATH"

      - name: Normalize Cargo.lock compatibility for SBF toolchain
        run: |
          if grep -q '^version = 4$' Cargo.lock; then
            echo "::warning::anchor/Cargo.lock uses lockfile v4; rewriting to v3 for Solana 1.18 SBF cargo compatibility."
            sed -i 's/^version = 4$/version = 3/' Cargo.lock
          fi
          if ! grep -q '^version = 3$' Cargo.lock; then
            echo "::error::anchor/Cargo.lock must contain version = 3 for Solana 1.18 SBF cargo compatibility."
            exit 1
          fi

      - name: Build Program
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/solana-release/bin:$PATH"
          anchor build

      - name: Run Tests
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/solana-release/bin:$PATH"
          yarn test
