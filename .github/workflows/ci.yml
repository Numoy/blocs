name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SOLANA_RPC_URL: ${{ secrets.NEXT_PUBLIC_SOLANA_RPC_URL || 'https://api.devnet.solana.com' }}
      NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.NEXT_PUBLIC_PRIVY_APP_ID || 'ci-placeholder' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  anchor:
    name: Anchor Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./anchor
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: anchor/yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      # Cache Cargo Registry (Speeds up Rust builds)
      - name: Cache Cargo registry + index
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anchor/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # Cache Solana CLI (Restored and fixed)
      - name: Cache Solana CLI
        id: cache-solana
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/solana-release
          key: solana-${{ runner.os }}-v3.1.9

      # Cache Anchor CLI
      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-${{ runner.os }}-v1.0.0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libudev-dev libssl-dev

      # Install Solana (Only if cache miss) - Using GitHub Releases for reliability
      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://github.com/anza-xyz/agave/releases/download/v3.1.9/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar jxf - -C $HOME

      # Install Anchor (Only if cache miss)
      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cargo/bin
          curl -sSfL https://github.com/solana-foundation/anchor/releases/download/v1.0.0/anchor-1.0.0-x86_64-unknown-linux-gnu -o ~/.cargo/bin/anchor
          chmod +x ~/.cargo/bin/anchor

      # Set Paths - This applies to all subsequent steps
      - name: Add Tools to Path
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/solana-release/bin" >> $GITHUB_PATH

      - name: Verify Versions
        run: |
          CARGO_BIN="$(command -v cargo)"
          echo "cargo path: ${CARGO_BIN}"
          if [[ "${CARGO_BIN}" != "$HOME/.cargo/bin/"* ]]; then
            echo "::error::Expected cargo from ~/.cargo/bin, got ${CARGO_BIN}"
            exit 1
          fi
          cargo --version
          solana --version
          anchor --version

      - name: Configure Anchor Wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          WALLET_PATH="$HOME/.config/solana/id.json"
          solana-keygen new --silent --no-bip39-passphrase --force -o "$WALLET_PATH"
          echo "ANCHOR_WALLET=$WALLET_PATH" >> "$GITHUB_ENV"
          echo "Configured Anchor wallet at $WALLET_PATH"

      - name: Normalize Cargo.lock compatibility for SBF toolchain
        run: |
          if grep -q '^version = 4$' Cargo.lock; then
            echo "::warning::anchor/Cargo.lock uses lockfile v4; rewriting to v3 for SBF cargo compatibility."
            sed -i 's/^version = 4$/version = 3/' Cargo.lock
          fi

      - name: Build Program
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/solana-release/bin:$PATH"
          export ANCHOR_WALLET="${ANCHOR_WALLET:-$HOME/.config/solana/id.json}"
          anchor build --ignore-keys

      - name: Run Tests
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/solana-release/bin:$PATH"
          export ANCHOR_WALLET="${ANCHOR_WALLET:-$HOME/.config/solana/id.json}"
          yarn test --skip-build --validator legacy
