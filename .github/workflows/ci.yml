name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    environment: staging
    env:
      NEXT_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
      HETZNER_ACCESS_KEY_ID: ${{ secrets.HETZNER_ACCESS_KEY_ID }}
      HETZNER_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_SECRET_ACCESS_KEY }}
      HETZNER_BUCKET_NAME: ${{ secrets.HETZNER_BUCKET_NAME }}
      HETZNER_REGION: fsn1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  anchor:
    name: Anchor Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./anchor
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: anchor/yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + index
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anchor/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # - name: Cache Solana CLI
      #   id: cache-solana
      #   uses: actions/cache@v3
      #   with:
      #     path: |
      #       ~/.local/share/solana/install
      #     key: solana-${{ runner.os }}-v1.18.23-v2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libudev-dev libssl-dev

      - name: Install Solana CLI
        # if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL --retry 5 --retry-delay 2 --retry-connrefused https://release.solana.com/v1.18.23/install)"
          SOLANA_INSTALL_BIN="$HOME/.local/share/solana/install/active_release/bin/solana-install"
          if [ ! -x "$SOLANA_INSTALL_BIN" ]; then
            echo "::error::Solana install did not produce solana-install binary at $SOLANA_INSTALL_BIN"
            exit 1
          fi
          "$SOLANA_INSTALL_BIN" init v1.18.23
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Setup Solana Path
        run: |
          echo "Locating Solana binaries..."
          SOLANA_BIN_DIR=$(find /home/runner/.local/share/solana -name cargo-build-sbf -type f | head -n 1 | xargs dirname)
          if [ -z "$SOLANA_BIN_DIR" ]; then
            echo "::error::Could not find cargo-build-sbf binary"
            exit 1
          fi
          echo "Found Solana binaries at: $SOLANA_BIN_DIR"
          chmod +x "$SOLANA_BIN_DIR/cargo-build-sbf"
          echo "$SOLANA_BIN_DIR" >> $GITHUB_PATH

      - name: Verify Solana Path
        run: |
          cargo-build-sbf --version

      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@v3
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-${{ runner.os }}-v0.32.1

      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cargo/bin
          curl -sSfL https://github.com/solana-foundation/anchor/releases/download/v0.32.1/anchor-0.32.1-x86_64-unknown-linux-gnu -o ~/.cargo/bin/anchor
          chmod +x ~/.cargo/bin/anchor

      - name: Add Anchor to Path
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Program
        run: anchor build

      # Run tests on localnet (default provider in CI usage usually implies localnet if not specified)
      - name: Run Tests
        run: anchor test
