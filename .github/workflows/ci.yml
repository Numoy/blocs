name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  anchor:
    name: Anchor Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./anchor
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: anchor/yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      # Cache Cargo Registry (Speeds up Rust builds)
      - name: Cache Cargo registry + index
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anchor/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # Cache Solana CLI (Restored and fixed)
      - name: Cache Solana CLI
        id: cache-solana
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: |
            ~/solana-release
          key: solana-${{ runner.os }}-v1.18.23

      # Cache Anchor CLI
      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-${{ runner.os }}-v0.32.1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libudev-dev libssl-dev

      # Install Solana (Only if cache miss) - Using GitHub Releases for reliability
      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://github.com/solana-labs/solana/releases/download/v1.18.23/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar jxf - -C $HOME

      # Install Anchor (Only if cache miss)
      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cargo/bin
          curl -sSfL https://github.com/solana-foundation/anchor/releases/download/v0.32.1/anchor-0.32.1-x86_64-unknown-linux-gnu -o ~/.cargo/bin/anchor
          chmod +x ~/.cargo/bin/anchor

      # Set Paths - This applies to all subsequent steps
      - name: Add Tools to Path
        run: |
          echo "$HOME/solana-release/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify Versions
        run: |
          solana --version
          anchor --version

      - name: Build Program
        run: anchor build

      - name: Run Tests
        run: yarn test
