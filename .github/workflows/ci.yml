name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    environment: staging
    env:
      NEXT_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
      HETZNER_ACCESS_KEY_ID: ${{ secrets.HETZNER_ACCESS_KEY_ID }}
      HETZNER_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_SECRET_ACCESS_KEY }}
      HETZNER_BUCKET_NAME: ${{ secrets.HETZNER_BUCKET_NAME }}
      HETZNER_REGION: fsn1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  anchor:
    name: Anchor Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./anchor
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: anchor/yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + index
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anchor/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # - name: Cache Solana CLI
      #   id: cache-solana
      #   uses: actions/cache@v3
      #   with:
      #     path: |
      #       ~/.local/share/solana/install
      #     key: solana-${{ runner.os }}-v1.18.23-v2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libudev-dev libssl-dev

      - name: Install Solana CLI
        # if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v1.18.23/install)"

      - name: Setup Solana Path
        run: |
          echo "Locating Solana binaries..."
          SOLANA_ACTIVE_BIN="$HOME/.local/share/solana/install/active_release/bin"
          if [ -d "$SOLANA_ACTIVE_BIN" ]; then
            echo "Adding active Solana bin to PATH: $SOLANA_ACTIVE_BIN"
            echo "$SOLANA_ACTIVE_BIN" >> $GITHUB_PATH
            export PATH="$SOLANA_ACTIVE_BIN:$PATH"
          fi
          SOLANA_BIN_PATH="$(command -v cargo-build-sbf || true)"
          if [ -z "$SOLANA_BIN_PATH" ]; then
            SOLANA_BIN_PATH="$(command -v cargo-build-bpf || true)"
          fi
          if [ -z "$SOLANA_BIN_PATH" ]; then
            SOLANA_SEARCH_ROOTS=(
              "$HOME/.local/share/solana"
              "$HOME/.local/share/solana/install"
            )
            for ROOT in "${SOLANA_SEARCH_ROOTS[@]}"; do
              if [ -d "$ROOT" ]; then
                SOLANA_BIN_PATH="$(find "$ROOT" -type f -name cargo-build-sbf -print -quit)"
                if [ -z "$SOLANA_BIN_PATH" ]; then
                  SOLANA_BIN_PATH="$(find "$ROOT" -type f -name cargo-build-bpf -print -quit)"
                fi
                if [ -n "$SOLANA_BIN_PATH" ]; then
                  break
                fi
              fi
            done
          fi
          if [ -z "$SOLANA_BIN_PATH" ]; then
            echo "::error::Could not find cargo-build-sbf or cargo-build-bpf binary"
            exit 1
          fi
          SOLANA_BIN_DIR="$(dirname "$SOLANA_BIN_PATH")"
          echo "Found Solana binaries at: $SOLANA_BIN_DIR"
          chmod +x "$SOLANA_BIN_PATH"
          echo "$SOLANA_BIN_DIR" >> $GITHUB_PATH

      - name: Verify Solana Path
        run: |
          cargo-build-sbf --version || echo "cargo-build-sbf not found in PATH yet (might need new shell)"

      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@v3
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-${{ runner.os }}-v0.32.1

      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cargo/bin
          curl -sSfL https://github.com/solana-foundation/anchor/releases/download/v0.32.1/anchor-0.32.1-x86_64-unknown-linux-gnu -o ~/.cargo/bin/anchor
          chmod +x ~/.cargo/bin/anchor

      - name: Add Anchor to Path
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Program
        run: anchor build

      # Run tests on localnet (default provider in CI usage usually implies localnet if not specified)
      - name: Run Tests
        run: anchor test
