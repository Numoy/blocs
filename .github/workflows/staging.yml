name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to deploy to staging (e.g. v1.0.0)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Resolve staging tag commit
        id: staging_ref
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tagName = `${{ inputs.release_tag }}`.trim();
            if (!/^v\d+\.\d+\.\d+$/.test(tagName)) {
              core.setFailed(
                `Invalid staging tag '${tagName}'. Expected strict semver tag format like v1.0.0.`,
              );
              return;
            }

            const refResponse = await github.rest.git.getRef({
              owner,
              repo,
              ref: `tags/${tagName}`,
            });

            const refObject = refResponse.data.object;
            let commitSha = null;

            if (refObject.type === "tag") {
              const tagResponse = await github.rest.git.getTag({
                owner,
                repo,
                tag_sha: refObject.sha,
              });
              const verification = tagResponse.data.verification;
              if (!verification?.verified) {
                const reason = verification?.reason || "unknown";
                core.warning(
                  `Staging tag ${tagName} is annotated but signature is not verified (${reason}). Continuing for staging.`,
                );
              } else {
                core.info(`Staging tag ${tagName} has a verified signature.`);
              }

              const taggedObject = tagResponse.data.object;
              if (taggedObject?.type !== "commit" || !taggedObject.sha) {
                core.setFailed(
                  `Tag ${tagName} must reference a commit. Found type: ${taggedObject?.type || "unknown"}.`,
                );
                return;
              }
              commitSha = taggedObject.sha;
            } else if (refObject.type === "commit") {
              // Lightweight tag; acceptable for staging.
              commitSha = refObject.sha;
              core.warning(
                `Staging tag ${tagName} is lightweight (unsigned). Continuing for staging deployment.`,
              );
            } else {
              core.setFailed(
                `Unsupported tag object type for ${tagName}: ${refObject.type}.`,
              );
              return;
            }

            core.setOutput("tag_name", tagName);
            core.setOutput("commit_sha", commitSha);
            core.info(`Resolved staging tag ${tagName} -> ${commitSha}`);

      - name: Checkout repository at staging tag commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.staging_ref.outputs.commit_sha }}

      - name: Normalize image repository name
        id: image_repo
        run: |
          set -euo pipefail
          repo="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "value=${repo}" >> "$GITHUB_OUTPUT"

      - name: Validate deployment configuration
        id: validate_config
        env:
          RAW_SITE_BASE_URL: ${{ vars.SITE_BASE_URL || secrets.SITE_BASE_URL }}
          RAW_NEXT_PUBLIC_SOLANA_RPC_URL: ${{ vars.NEXT_PUBLIC_SOLANA_RPC_URL || secrets.NEXT_PUBLIC_SOLANA_RPC_URL || 'https://api.devnet.solana.com' }}
          RAW_SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL || secrets.SOLANA_RPC_URL }}
          HETZNER_ACCESS_KEY_ID: ${{ secrets.HETZNER_ACCESS_KEY_ID }}
          HETZNER_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_SECRET_ACCESS_KEY }}
          HETZNER_BUCKET_NAME: ${{ vars.HETZNER_BUCKET_NAME }}
          RAW_HETZNER_ENDPOINT: ${{ vars.HETZNER_ENDPOINT || secrets.HETZNER_ENDPOINT }}
          RAW_HETZNER_PUBLIC_BASE_URL: ${{ vars.HETZNER_PUBLIC_BASE_URL || secrets.HETZNER_PUBLIC_BASE_URL }}
          RAW_NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.NEXT_PUBLIC_PRIVY_APP_ID || secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
        run: |
          set -euo pipefail

          normalize_url() {
            local raw="${1:-}"
            raw="$(printf '%s' "$raw" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

            if [ -z "$raw" ]; then
              return 1
            fi

            if [ "${raw:0:1}" = "'" ] && [ "${raw: -1}" = "'" ]; then
              raw="${raw:1:${#raw}-2}"
            elif [ "${raw:0:1}" = '"' ] && [ "${raw: -1}" = '"' ]; then
              raw="${raw:1:${#raw}-2}"
            fi

            raw="$(printf '%s' "$raw" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -z "$raw" ]; then
              return 1
            fi

            local lower
            lower="$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              undefined|null|false|true|nan|none) return 1 ;;
            esac

            if printf '%s' "$raw" | grep -Fq '$''{{'; then
              return 1
            fi

            if [[ "$raw" == //* ]]; then
              raw="https:${raw}"
            elif [[ ! "$raw" =~ ^[a-zA-Z][a-zA-Z0-9+.-]*: ]]; then
              raw="https://${raw}"
            fi

            if [[ ! "$raw" =~ ^https?:// ]]; then
              return 1
            fi

            printf '%s' "$raw"
          }

          require_non_empty() {
            local name="$1"
            local value="${2:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          }

          require_non_empty "NEXT_PUBLIC_PRIVY_APP_ID" "${RAW_NEXT_PUBLIC_PRIVY_APP_ID:-}"
          require_non_empty "SITE_BASE_URL" "${RAW_SITE_BASE_URL:-}"
          require_non_empty "HETZNER_ACCESS_KEY_ID" "${HETZNER_ACCESS_KEY_ID:-}"
          require_non_empty "HETZNER_SECRET_ACCESS_KEY" "${HETZNER_SECRET_ACCESS_KEY:-}"
          require_non_empty "HETZNER_BUCKET_NAME" "${HETZNER_BUCKET_NAME:-}"

          if ! site_base_url="$(normalize_url "${RAW_SITE_BASE_URL:-}")"; then
            echo "::error::SITE_BASE_URL is missing or invalid. Example: https://staging.10000-blocks.com"
            exit 1
          fi
          site_base_url="${site_base_url%/}"

          if ! next_public_rpc="$(normalize_url "${RAW_NEXT_PUBLIC_SOLANA_RPC_URL:-}")"; then
            echo "::error::NEXT_PUBLIC_SOLANA_RPC_URL is invalid. Example: https://api.devnet.solana.com"
            exit 1
          fi

          if [ -n "${RAW_SOLANA_RPC_URL:-}" ]; then
            if ! solana_rpc="$(normalize_url "${RAW_SOLANA_RPC_URL}")"; then
              echo "::error::SOLANA_RPC_URL is invalid. Example: https://api.devnet.solana.com"
              exit 1
            fi
          else
            solana_rpc="$next_public_rpc"
          fi

          if [ -n "${RAW_HETZNER_ENDPOINT:-}" ] && ! normalize_url "${RAW_HETZNER_ENDPOINT}" >/dev/null; then
            echo "::error::HETZNER_ENDPOINT is invalid. Example: https://fsn1.your-objectstorage.com"
            exit 1
          fi

          if [ -n "${RAW_HETZNER_PUBLIC_BASE_URL:-}" ] && ! normalize_url "${RAW_HETZNER_PUBLIC_BASE_URL}" >/dev/null; then
            echo "::error::HETZNER_PUBLIC_BASE_URL is invalid. Example: https://fsn1.your-objectstorage.com/blocs-storage"
            exit 1
          fi

          echo "site_base_url=${site_base_url}" >> "$GITHUB_OUTPUT"
          echo "next_public_solana_rpc_url=${next_public_rpc}" >> "$GITHUB_OUTPUT"
          echo "solana_rpc_url=${solana_rpc}" >> "$GITHUB_OUTPUT"
          echo "next_public_privy_app_id=${RAW_NEXT_PUBLIC_PRIVY_APP_ID}" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_repo.outputs.value }}
          tags: |
            type=raw,value=staging-${{ steps.staging_ref.outputs.tag_name }}
            type=raw,value=staging-latest

      - name: Build and push Docker image
        id: build_image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SOLANA_RPC_URL=${{ steps.validate_config.outputs.next_public_solana_rpc_url }}
            NEXT_PUBLIC_PRIVY_APP_ID=${{ steps.validate_config.outputs.next_public_privy_app_id }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign container image (keyless)
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.image_repo.outputs.value }}@${{ steps.build_image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_REF"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image_repo.outputs.value }}
          subject-digest: ${{ steps.build_image.outputs.digest }}
          push-to-registry: true

      - name: Generate image SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.REGISTRY }}/${{ steps.image_repo.outputs.value }}@${{ steps.build_image.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-staging-${{ steps.staging_ref.outputs.tag_name }}
          path: sbom.spdx.json
          if-no-files-found: error

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          SITE_BASE_URL: ${{ steps.validate_config.outputs.site_base_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          NEXT_PUBLIC_SOLANA_RPC_URL: ${{ steps.validate_config.outputs.next_public_solana_rpc_url }}
          SOLANA_RPC_URL: ${{ steps.validate_config.outputs.solana_rpc_url }}
          HETZNER_ACCESS_KEY_ID: ${{ secrets.HETZNER_ACCESS_KEY_ID }}
          HETZNER_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_SECRET_ACCESS_KEY }}
          HETZNER_BUCKET_NAME: ${{ vars.HETZNER_BUCKET_NAME }}
          HETZNER_REGION: ${{ vars.HETZNER_REGION || secrets.HETZNER_REGION || 'fsn1' }}
          HETZNER_ENDPOINT: ${{ vars.HETZNER_ENDPOINT || secrets.HETZNER_ENDPOINT }}
          HETZNER_PUBLIC_BASE_URL: ${{ vars.HETZNER_PUBLIC_BASE_URL || secrets.HETZNER_PUBLIC_BASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ vars.UPSTASH_REDIS_REST_URL || secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ vars.UPSTASH_REDIS_REST_TOKEN || secrets.UPSTASH_REDIS_REST_TOKEN }}
          ALLOW_IN_MEMORY_UPLOAD_GUARDS: ${{ vars.ALLOW_IN_MEMORY_UPLOAD_GUARDS || secrets.ALLOW_IN_MEMORY_UPLOAD_GUARDS || 'true' }}
          BLOCS_IMAGE: ${{ env.REGISTRY }}/${{ steps.image_repo.outputs.value }}@${{ steps.build_image.outputs.digest }}
          BLOCS_BUILD_COMMIT_SHA: ${{ steps.staging_ref.outputs.commit_sha }}
          BLOCS_BUILD_TAG: ${{ steps.staging_ref.outputs.tag_name }}
          BLOCS_IMAGE_DIGEST: ${{ steps.build_image.outputs.digest }}
        with:
          host: ${{ vars.SERVER_HOST || secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SITE_BASE_URL,GITHUB_TOKEN,GITHUB_ACTOR,NEXT_PUBLIC_SOLANA_RPC_URL,SOLANA_RPC_URL,HETZNER_ACCESS_KEY_ID,HETZNER_SECRET_ACCESS_KEY,HETZNER_BUCKET_NAME,HETZNER_REGION,HETZNER_ENDPOINT,HETZNER_PUBLIC_BASE_URL,UPSTASH_REDIS_REST_URL,UPSTASH_REDIS_REST_TOKEN,ALLOW_IN_MEMORY_UPLOAD_GUARDS,BLOCS_IMAGE,BLOCS_BUILD_COMMIT_SHA,BLOCS_BUILD_TAG,BLOCS_IMAGE_DIGEST
          script: |
            set -euo pipefail

            compose() {
              if docker compose version >/dev/null 2>&1; then
                docker compose "$@"
              else
                docker-compose "$@"
              fi
            }

            print_diagnostics() {
              echo "---- docker compose ps ----"
              compose ps || true
              echo "---- blocs logs (tail) ----"
              docker logs --tail 200 blocs || true
              echo "---- caddy logs (tail) ----"
              docker logs --tail 120 caddy || true
            }

            probe_with_retry() {
              url="$1"
              output_file="$2"
              expected_status="$3"
              label="$4"
              max_attempts="${5:-30}"
              sleep_seconds="${6:-2}"

              attempt=1
              while [ "$attempt" -le "$max_attempts" ]; do
                status="$(curl -sS -o "$output_file" -w "%{http_code}" "$url" || true)"
                if [ "$status" = "$expected_status" ]; then
                  echo "$label ready (attempt $attempt/$max_attempts)."
                  return 0
                fi
                echo "$label not ready (attempt $attempt/$max_attempts, status $status)."
                sleep "$sleep_seconds"
                attempt=$((attempt + 1))
              done

              echo "$label failed after $max_attempts attempts."
              cat "$output_file" || true
              print_diagnostics
              return 1
            }

            # Login to GHCR
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            cd ~/blocs
            git fetch --prune origin

            if ! git cat-file -e "${BLOCS_BUILD_COMMIT_SHA}^{commit}" 2>/dev/null; then
              echo "Commit ${BLOCS_BUILD_COMMIT_SHA} is not available after fetch."
              exit 1
            fi

            git checkout --detach "${BLOCS_BUILD_COMMIT_SHA}"
            echo "Checked out staging commit ${BLOCS_BUILD_COMMIT_SHA}."

            # Pull the latest image
            compose pull

            # Restart containers without an explicit down to reduce downtime.
            compose up -d --no-build --remove-orphans

            echo "Running smoke checks..."

            site_base_url="${SITE_BASE_URL%/}"
            probe_with_retry "${site_base_url}/" /tmp/blocs_home_probe.txt 200 "Homepage" 40 2
            probe_with_retry "${site_base_url}/api/health" /tmp/blocs_health_probe.json 200 "Health endpoint" 40 2

            if ! grep -q '"configured":true' /tmp/blocs_health_probe.json; then
              echo "Health smoke check indicates upload/runtime configuration is incomplete"
              cat /tmp/blocs_health_probe.json
              print_diagnostics
              exit 1
            fi

            upload_attempt=1
            UPLOAD_STATUS=""
            while [ "$upload_attempt" -le 20 ]; do
              UPLOAD_STATUS=$(curl -sS -o /tmp/blocs_upload_probe.json -w "%{http_code}" -X POST \
                -F owner=test \
                -F blockId=1 \
                -F timestamp=1 \
                -F signature=test \
                "${site_base_url}/api/upload" || true)

              if [ "$UPLOAD_STATUS" = "400" ]; then
                echo "Upload endpoint ready (attempt $upload_attempt/20)."
                break
              fi

              echo "Upload endpoint not ready (attempt $upload_attempt/20, status $UPLOAD_STATUS)."
              sleep 2
              upload_attempt=$((upload_attempt + 1))
            done

            if [ "$UPLOAD_STATUS" != "400" ]; then
              echo "Upload smoke check failed with status $UPLOAD_STATUS"
              cat /tmp/blocs_upload_probe.json || true
              print_diagnostics
              exit 1
            fi

            if grep -q "Upload service is not configured" /tmp/blocs_upload_probe.json; then
              echo "Upload smoke check detected missing runtime config"
              cat /tmp/blocs_upload_probe.json
              print_diagnostics
              exit 1
            fi

            echo "Smoke checks passed."
