version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "eslint"
        versions: [">= 10.0.0"]

  - package-ecosystem: "npm"
    directory: "/anchor"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "cargo"
    directory: "/anchor/programs/blocs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "time"
        versions: [">= 0.3.42"]
      - dependency-name: "indexmap"
        versions: [">= 2.12.0"]
      - dependency-name: "borsh"
        versions: [">= 1.6.0"]
      - dependency-name: "proc-macro-crate"
        versions: [">= 3.4.0"]
      - dependency-name: "solana-pubkey"
        versions: [">= 2.3.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
